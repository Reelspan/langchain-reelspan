[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-reelspan"
dynamic = ["version"]
description = "LangChain tools for Reelspan: let an agent publish videos, photos and text to TikTok, YouTube, Instagram, X, LinkedIn and more, check results and read analytics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anjum Labs", email = "support@reelspan.com" }]
keywords = ["reelspan", "langchain", "langgraph", "agents", "tools", "social media", "publishing", "tiktok", "youtube", "instagram", "upload-post"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=0.3.0", "reelspan>=1.0.0"]

[project.optional-dependencies]
test = ["pytest>=8", "langchain-tests>=0.3.0"]

[project.urls]
Homepage = "https://reelspan.com/docs/langchain"
Source = "https://github.com/Reelspan/langchain-reelspan"
Issues = "https://github.com/Reelspan/langchain-reelspan/issues"

[tool.setuptools]
packages = ["langchain_reelspan"]

[tool.setuptools.dynamic]
version = { attr = "langchain_reelspan.__version__" }

[tool.setuptools.package-data]
langchain_reelspan = ["py.typed"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
